name: Performance benchmarks

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Git ref to compare against the selected workflow ref
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: |
            candidate/package-lock.json
            baseline/package-lock.json
      - name: Build baseline
        working-directory: baseline
        run: |
          npm ci
          npx --no-install tsup
      - name: Verify and prepare candidate
        working-directory: candidate
        run: |
          npm ci
          npm run build
          npm run bench:prepare
      - name: Measure baseline with candidate harness
        working-directory: candidate
        run: |
          node .bench-build/run.js --module ../baseline/dist/index.js --out .bench-results/baseline-time.json
          node .bench-build/run.js --mode memory --module ../baseline/dist/index.js --out .bench-results/baseline-memory.json
      - name: Measure candidate
        working-directory: candidate
        run: |
          node .bench-build/run.js --out .bench-results/candidate-time.json
          node .bench-build/run.js --mode memory --out .bench-results/candidate-memory.json
      - name: Compare time
        working-directory: candidate
        run: npm run bench:compare -- .bench-results/baseline-time.json .bench-results/candidate-time.json --out .bench-results/comparison-time.json
      - name: Compare memory
        if: ${{ !cancelled() }}
        working-directory: candidate
        run: npm run bench:compare -- .bench-results/baseline-memory.json .bench-results/candidate-memory.json --out .bench-results/comparison-memory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-reports
          path: candidate/.bench-results/
          if-no-files-found: warn
